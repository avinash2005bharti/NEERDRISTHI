version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: orca-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - orca-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Valkey — open-source Redis-compatible cache (drop-in replacement for Redis 7.x)
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: orca-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - orca-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: orca-ai-services
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./ai-services/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=orca
      - VALKEY_URL=redis://valkey:6379/0
    depends_on:
      mongodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orca-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=orca
      - FASTAPI_INTERNAL_URL=http://ai-services:8000
    depends_on:
      mongodb:
        condition: service_healthy
      ai-services:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  orca-mongo-data:
  orca-valkey-data:
